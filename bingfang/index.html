<style>

/* ===== 日历视图 ===== */
.cal-head { display:flex; align-items:center; justify-content:space-between; padding:4px 6px 12px; }
.cal-head .ym { font-size:17px; font-weight:600; }

/* ===== 日记视图 ===== */

/* ===== 周期回顾视图 ===== */
.review-filter { background:#fff; border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.review-filter .fr-row { display:flex; gap:10px; margin-bottom:10px; }
.review-filter select {
  flex:1; border:1px solid #d3dce8; border-radius:10px; padding:10px; font-size:15px;
  background:#fff; min-height:44px; outline:none;
}
.review-filter .go-btn {
  width:100%; border:none; background:#1976d2; color:#fff; font-size:15px; font-weight:600;
  padding:12px 0; border-radius:12px; cursor:pointer; min-height:46px;
}
.review-head { display:flex; align-items:center; justify-content:space-between; margin:4px 2px 10px; }
.review-head .rh-title { font-size:15px; font-weight:700; color:#1976d2; }
.review-head .rh-actions { display:flex; gap:6px; }
.review-head .rh-actions button {
  border:1px solid #d3dce8; background:#fff; color:#5a6675; font-size:12px;

}
.timeline { position:relative; padding-left:18px; }
.timeline::before {

}
.time-group { position:relative; margin-bottom:14px; }
.time-group::before {
  content:""; position:absolute; left:-17px; top:10px; width:10px; height:10px;
  border-radius:50%; background:#1976d2; border:2px solid #fff; box-shadow:0 0 0 2px #bbdefb;
}
.time-tag {
  display:inline-flex; align-items:center; gap:6px; background:#1976d2; color:#fff;
  font-size:15px; font-weight:700; padding:5px 14px; border-radius:16px; margin-bottom:8px;
}
.time-tag .fire { font-size:11px; background:#ff7043; border-radius:8px; padding:1px 6px; font-weight:600; }
.tg-rec {
  background:#fff; border-radius:10px; padding:9px 12px; margin-bottom:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.05); display:flex; align-items:center; gap:8px;
}
.tg-rec.alt { background:#f4f8fd; }
.tg-rec .tg-body { flex:1; min-width:0; }
.tg-rec .tg-date { font-size:12px; color:#1976d2; font-weight:600; }
.tg-rec .tg-work { font-size:14px; color:#333; line-height:1.5; word-break:break-word; }
.tg-rec .tg-people { font-size:12px; color:#8a94a6; }
.tg-rec .tg-jump {
  border:none; background:#e3f2fd; color:#1976d2; font-size:12px; padding:6px 10px;

.review-stats {

}
.review-stats b { color:#1976d2; }

<body>
<header class="appbar">病房纪要</header>
<main id="main"></main>
<script>
/* ================= 数据层（IndexedDB） ================= */
// 结构：{ date:"2026-08-19", morning:[{time,work,people}], afternoon:[...], evening:[...], summary:"" }
const SLOTS = [
  { key:"morning",   name:"上午", ico:"🌅", defTime:"09:00" },
  { key:"afternoon", name:"下午", ico:"🌞", defTime:"15:00" },
  { key:"evening",   name:"晚上", ico:"🌙", defTime:"20:00" }
];
const WD_NAMES = ["周日","周一","周二","周三","周四","周五","周六"];
let db = null;
let ALL = {}; // 内存缓存：date -> record

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("wardNotesDB", 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", { keyPath:"date" });
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}
function idbPut(rec) {
  return new Promise(res => {
    const r = db.transaction("notes","readwrite").objectStore("notes").put(rec);
    r.onsuccess = () => res(); r.onerror = () => res();
  });
}
function idbAll() {
  return new Promise(res => {
    const r = db.transaction("notes","readonly").objectStore("notes").getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => res([]);
  });
}
function emptyRec(date) { return { date:date, morning:[], afternoon:[], evening:[], summary:"" }; }
function getRec(date) { return ALL[date] || emptyRec(date); }
function hasContent(rec) {
  if (!rec) return false;
  return SLOTS.some(s => (rec[s.key]||[]).some(r => (r.work&&r.work.trim()) || (r.people&&r.people.trim())));
}

/* ---- v1 localStorage → v2 IndexedDB 迁移（只执行一次） ---- */
async function migrateV1() {
  if (localStorage.getItem("wardNotes_migrated")) return;
  let v1 = null;
  try { v1 = JSON.parse(localStorage.getItem("wardNotes")); } catch(e) {}
  localStorage.setItem("wardNotes_migrated", "1");
  if (!v1) return;
  for (const date of Object.keys(v1)) {
    const old = v1[date];
    const rec = emptyRec(date);
    SLOTS.forEach(s => {
      const r = old[s.key];
      if (r && ((r.work && r.work.trim()) || (r.people && r.people.trim())))
        rec[s.key].push({ time: r.start || s.defTime, work: r.work || "", people: r.people || "" });
    });
    if (hasContent(rec)) { ALL[date] = rec; await idbPut(rec); }
  }
}

/* ================= 公共 ================= */
const main = document.getElementById("main");
const today = new Date(); today.setHours(0,0,0,0);
let calY = today.getFullYear(), calM = today.getMonth();
let curDate = null;
let searchQ = "";

function pad(n){ return String(n).padStart(2,"0"); }
function dateKey(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
function escapeHtml(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function renderSummaryText(t) {
  // 先转义 HTML，再支持 AI 返回的简单 markdown：**粗体** 和 # 标题行
  let h = escapeHtml(t);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/^[ \t]*#{1,4}[ \t]*(.+)$/gm, "<b>$1</b>");
  return h;
}
function hourOptions(selected) {
  let h = "";
  for (let i=0;i<24;i++) {
    const v = pad(i)+":00";
    h += '<option value="'+v+'"'+(v===selected?" selected":"")+'>'+v+'</option>';
  }
  return h;
}
function fmtCN(key) { // "2026-08-05" -> "8月5日"
  const p = key.split("-");
  return parseInt(p[1])+"月"+parseInt(p[2])+"日";
}
function weekId(key) { // 用于"横跨 N 周"统计：该日期所在周的周一
  const d = new Date(key+"T00:00:00");
  d.setDate(d.getDate() - (d.getDay()+6)%7);
  return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
}
function debounce(fn, ms) {
  let t; return function(){ clearTimeout(t); const a=arguments, s=this; t=setTimeout(()=>fn.apply(s,a), ms); };
}

/* ================= 日历视图 ================= */
function renderCalendar() {
  curDate = null;
  const first = new Date(calY, calM, 1);
  const daysInMonth = new Date(calY, calM+1, 0).getDate();
  const offset = (first.getDay()+6)%7;

  let html = '<div class="cal-head">'
    + '<button onclick="changeMonth(-1)">‹</button>'
    + '<div class="ym">'+calY+'年'+(calM+1)+'月</div>'
    + '<button onclick="changeMonth(1)">›</button></div>';

  html += '<div class="search-box"><input type="search" placeholder="🔍 搜索历史记录关键词" value="'
    + escapeHtml(searchQ) + '" oninput="doSearch(this.value)"></div>';

  html += '<div class="cal-grid">';
  ["一","二","三","四","五","六","日"].forEach(d=>{ html += '<div class="dow">'+d+'</div>'; });
  for (let i=0;i<offset;i++) html += '<div class="cal-cell blank"></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const date = new Date(calY, calM, d);
    const key = dateKey(calY, calM, d);
    const noted = hasContent(ALL[key]);
    let cls = "cal-cell";
    if (date.getDay()===0 || date.getDay()===6) cls += " weekend";
    if (date.getTime()===today.getTime()) cls += " today";
    if (noted) cls += " has-note";
    html += '<div class="'+cls+'" onclick="openDay('+d+')">'
      + '<div class="num">'+d+'</div>'
      + '<div class="dot-mark'+(noted?"":" none")+'"></div></div>';
  }
  html += '</div>';

  html += '<div class="cal-actions">'
    + '<button onclick="renderReview()">📊 周期回顾</button>'
    + '<button onclick="exportMonth()">📄 导出本月</button>'
    + '</div>';

  html += '<div id="searchResult"></div>';
  main.innerHTML = html;
  applySearch();
}
function changeMonth(delta) {
  calM += delta;
  if (calM<0) { calM=11; calY--; }
  if (calM>11) { calM=0; calY++; }
  renderCalendar();
}
function openDay(d) { curDate = new Date(calY, calM, d); renderDay(); }
function openDayByKey(key) {
  const p = key.split("-").map(Number);
  calY = p[0]; calM = p[1]-1;
  curDate = new Date(p[0], p[1]-1, p[2]);
  renderDay();
}

/* ---- 历史记录搜索 ---- */
function doSearch(q) { searchQ = q.trim(); applySearch(); }
function applySearch() {
  const box = document.getElementById("searchResult");
  if (!box) return;
  if (!searchQ) { box.innerHTML = ""; return; }
  const hits = [];
  Object.keys(ALL).sort().forEach(date => {
    const rec = ALL[date];
    SLOTS.forEach(s => {
      (rec[s.key]||[]).forEach(r => {
        if ((r.work && r.work.includes(searchQ)) || (r.people && r.people.includes(searchQ)))
          hits.push({ date:date, slot:s, r:r });
      });
    });
  });
  let html = '<div class="search-result"><h3>“'+escapeHtml(searchQ)+'”找到 '+hits.length+' 条记录</h3>';
  if (!hits.length) html += '<div class="empty-tip">没有匹配的记录</div>';
  hits.forEach(h => {
    html += '<div class="sr-item" onclick="openDayByKey(\''+h.date+'\')">'
      + '<div class="sr-date">'+h.date+' '+WD_NAMES[new Date(h.date+"T00:00:00").getDay()]+' · '+h.slot.ico+' '+h.slot.name+' '+h.r.time+'</div>'
      + '<div class="sr-text">'+escapeHtml(h.r.work||"（无工作内容）")+'</div>'
      + (h.r.people ? '<div class="sr-people">人员：'+escapeHtml(h.r.people)+'</div>' : '')
      + '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
}

/* ================= 日记视图 ================= */
const debouncedSave = debounce(saveCurDate, 500);

function saveCurDate() {
  const key = dateKey(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
  idbPut(ALL[key]);
}

function renderDay() {
  const y = curDate.getFullYear(), m = curDate.getMonth(), d = curDate.getDate();
  const key = dateKey(y, m, d);
  if (!ALL[key]) ALL[key] = emptyRec(key);
  const rec = ALL[key];

  let html = '<div class="day-head">'
    + '<button class="back-btn" onclick="renderCalendar()">← 返回日历</button>'
    + '<div class="day-title">'+y+'年'+(m+1)+'月'+d+'日 周'+WD_NAMES[curDate.getDay()].slice(1)+'</div>'
    + '</div>';

  SLOTS.forEach(s => {
    const list = rec[s.key] || [];
    html += '<div class="slot-card '+s.key+'">'
      + '<div class="slot-name">'+s.ico+' '+s.name+'</div>';
    if (!list.length) html += '<div class="empty-slot">'+s.name+'暂无记录，点击添加</div>';
    list.forEach((r, idx) => {
      html += '<div class="rec-card">'
        + '<div class="rec-top">'
        + '<select class="rec-time" id="'+s.key+'-'+idx+'-time" onchange="updateRecord(\''+s.key+'\','+idx+')">'+hourOptions(r.time || s.defTime)+'</select>'
        + '<button class="rec-del" onclick="deleteRecord(\''+s.key+'\','+idx+')">删除</button>'
        + '</div>'
        + '<textarea class="rec-work" id="'+s.key+'-'+idx+'-work" placeholder="做了什么…" oninput="updateRecord(\''+s.key+'\','+idx+')">'+escapeHtml(r.work||"")+'</textarea>'
        + '<input class="rec-people" id="'+s.key+'-'+idx+'-people" placeholder="见了谁…" value="'+escapeHtml(r.people||"")+'" oninput="updateRecord(\''+s.key+'\','+idx+')">'
        + '<div class="rec-saved" id="'+s.key+'-'+idx+'-saved">已自动保存 ✓</div>'
        + '</div>';
    });
    html += '<button class="add-btn" onclick="addRecord(\''+s.key+'\')">+ 添加记录</button>'
      + '</div>';
  });

  html += '<button class="day-export" onclick="exportDay()">📄 导出当日记录</button>';
  html += renderAICard(rec);
  main.innerHTML = html;
}

/* ================= 导出 ================= */
function buildDayText(key) {
  const rec = ALL[key];
  if (!hasContent(rec)) return null;
  const d = new Date(key+"T00:00:00");
  const lines = ["【"+key+" "+WD_NAMES[d.getDay()]+"】"];
  SLOTS.forEach(s => {
    (rec[s.key]||[]).forEach(r => {
      if (!(r.work&&r.work.trim()) && !(r.people&&r.people.trim())) return;
      lines.push(s.ico+" "+s.name+" "+(r.time||""));
      if (r.work && r.work.trim()) lines.push("  工作："+r.work.trim());
      if (r.people && r.people.trim()) lines.push("  会见："+r.people.trim());
    });
  });
  if (rec.summary) { lines.push("🤖 日报："); lines.push(rec.summary); }
  return lines.join("\n");
}
function downloadText(filename, text) {
  const blob = new Blob(["\ufeff"+text], { type:"text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
function exportDay() {
  const key = dateKey(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
  const text = buildDayText(key);
  if (!text) { alert("当日还没有任何记录"); return; }
  downloadText("病房纪要-"+key+".txt", text+"\n");
}
function exportMonth() {
  const daysInMonth = new Date(calY, calM+1, 0).getDate();
  const parts = ["病房纪要导出："+calY+"年"+(calM+1)+"月", ""];
  let count = 0;
  for (let d=1; d<=daysInMonth; d++) {
    const t = buildDayText(dateKey(calY, calM, d));
    if (t) { count++; parts.push(t, ""); }
  }
  if (!count) { alert("本月还没有任何记录"); return; }
  downloadText("病房纪要-"+calY+"-"+pad(calM+1)+".txt", parts.join("\n"));
}

/* 发起一次 AI 请求，成功返回 {text}，失败返回 {err: 原因} */
async function callAIOnce(cfg, content, timeoutMs) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 30000);
    const resp = await fetch(cfg.base.replace(/\/+$/,"")+"/chat/completions", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:"user", content: content }] }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!resp.ok) {
      let msg = "HTTP "+resp.status;
      try {
        const err = await resp.json();
        if (err && err.error && err.error.message) msg += "：" + err.error.message;
      } catch(e) {}
      if (resp.status===401) msg += "（Key 无效或带有多余空格）";
      if (resp.status===404) msg += "（模型名错误或该账号无此模型权限）";
      if (resp.status===429) msg += "（超出频率/额度限制）";
      return { err: msg, status: resp.status };
    }
    const data = await resp.json();
    const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) return { err: "接口返回内容为空" };
    return { text: text };
  } catch(e) {
    if (e.name === "AbortError") return { err: "请求超时（网络较慢或生成内容较长）", retryable: true };
    return { err: "网络错误：" + (e.message || e.name) + "（可能是跨域被拦或断网）", retryable: true };
  }
}

function sleep(ms) { return new Promise(r=>setTimeout(r, ms)); }

/* 发起一次 AI 请求，成功返回 {text}，失败返回 {err: 原因}；429 和网络/超时错误自动重试 */
async function callAI(cfg, content, timeoutMs) {
  const waits = [5000, 15000, 30000]; // 共 4 次尝试
  let r = null;
  for (let attempt=0; attempt<=waits.length; attempt++) {
    if (attempt > 0) await sleep(waits[attempt-1]);
    r = await callAIOnce(cfg, content, timeoutMs);
    if (!r.err) return r;
    if (r.status !== 429 && !r.retryable) return r; // 429 / 网络 / 超时才重试
  }
  return { err: r.err + "（已自动重试 4 次仍失败，请检查网络后稍后再试）" };
}

function collectDayLines() {
  const key = dateKey(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
  const rec = ALL[key];
  const lines = [];
  SLOTS.forEach(s => {
    (rec[s.key]||[]).forEach(r => {
      if (!(r.work&&r.work.trim()) && !(r.people&&r.people.trim())) return;
      lines.push("["+(r.time||"--:--")+" "+s.name+"] "+(r.work||"").trim()+(r.people&&r.people.trim() ? " | 人员："+r.people.trim() : ""));
    });
  });
  return lines;
}

function localSummary(lines) {
  const peopleSet = [];
  lines.forEach(l => {
    const m = l.match(/人员：(.+)$/);
    if (m) m[1].split(/[、，,\s\/]+/).forEach(p => { if (p && !peopleSet.includes(p)) peopleSet.push(p); });
  });
  let text = "【本地总结】\n今日共 "+lines.length+" 条工作记录：\n";
  lines.forEach(l => { text += "· " + l + "\n"; });
  if (peopleSet.length) text += "涉及人员："+peopleSet.join("、")+"\n";
  text += "（以上为规则拼接的基础总结，配置 API 后可获得更智能的梳理）";
  return text;
}

let isGenerating = false;
async function generateSummary() {
  if (isGenerating) return; // 防重复点击：前一个请求还在跑，避免自己撞自己的并发槽
  saveAICfg();
  const lines = collectDayLines();
  if (!lines.length) { alert("当日还没有记录，先添加记录再生成日报"); return; }
  const key = dateKey(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
  const cfg = aiCfg();
  const btn = document.getElementById("ai-gen");

  // 生成前校验：选了服务商但信息不全时直接提示，不静默降级
  if (cfg.provider && (!cfg.key || !cfg.base || !cfg.model)) {
    const missing = [!cfg.key&&"API Key", !cfg.base&&"接口地址", !cfg.model&&"模型名"].filter(Boolean).join("、");
    alert("AI 配置不完整，缺少：" + missing + "\n请展开「配置 API」补全，或把服务商改回「未配置」。");
    return;
  }

  isGenerating = true;
  btn.disabled = true; btn.textContent = "生成中（约1-2分钟，请勿重复点击）…";
  let summary = null, errDetail = "";
  if (cfg.provider && cfg.key && cfg.base && cfg.model) {
    const prompt = "你是一名医疗工作助手。请根据以下病房工作记录，生成一份简洁的日报摘要。\n"
      + "要求：按时间顺序梳理，突出重点工作、关键人员和待办事项。语言专业、简洁。\n\n记录：\n" + lines.join("\n");
    const r = await callAI(cfg, prompt, 120000);
    if (r.text) summary = r.text;
    else errDetail = r.err;
  }
  if (!summary) summary = localSummary(lines);

  ALL[key].summary = summary;
  ALL[key].summaryErr = errDetail || "";
  isGenerating = false;
  saveCurDate();
  aiCfgOpen = false;
  renderDay();
}

function copySummary() {
  const key = dateKey(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
  const text = (ALL[key].summary || "").replace(/^【本地总结】\n?/, "");
  const done = () => alert("已复制到剪贴板");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e) {}
  document.body.removeChild(ta);
}

/* ================= 📊 周期规律回顾 ================= */
let reviewWeekday = 2;  // 默认周二（1=周一 … 7=周日）
let reviewSlot = "morning";
let reviewOrder = "asc"; // asc=旧→新, desc=新→旧
let reviewRan = false;

function renderReview() {
  curDate = null;
  const slotObj = SLOTS.find(s=>s.key===reviewSlot);
  let html = '<div class="day-head">'
    + '<button class="back-btn" onclick="renderCalendar()">← 返回日历</button>'
    + '<div class="day-title">📊 周期规律回顾</div>'
    + '</div>';

  html += '<div class="review-filter"><div class="fr-row">'
    + '<select id="rv-weekday">'
    + ["周一","周二","周三","周四","周五","周六","周日"].map((n,i)=>'<option value="'+(i+1)+'"'+(reviewWeekday===i+1?" selected":"")+'>'+n+'</option>').join("")
    + '</select>'
    + '<select id="rv-slot">'
    + SLOTS.map(s=>'<option value="'+s.key+'"'+(reviewSlot===s.key?" selected":"")+'>'+s.ico+' '+s.name+'</option>').join("")
    + '</select>'
    + '</div>'
    + '<button class="go-btn" onclick="runReview()">查看规律</button>'
    + '</div>';

  html += '<div id="reviewResult"></div>';
  main.innerHTML = html;
  if (reviewRan) runReview();
}

function runReview() {
  reviewWeekday = parseInt(document.getElementById("rv-weekday").value);
  reviewSlot = document.getElementById("rv-slot").value;
  reviewRan = true;
  const slotObj = SLOTS.find(s=>s.key===reviewSlot);
  const wdName = ["","周一","周二","周三","周四","周五","周六","周日"][reviewWeekday];
  const box = document.getElementById("reviewResult");

  // 收集匹配记录
  const byTime = {}; // time -> [{date, work, people}]
  Object.keys(ALL).forEach(date => {
    const d = new Date(date+"T00:00:00");
    const wd = d.getDay()===0 ? 7 : d.getDay();
    if (wd !== reviewWeekday) return;
    (ALL[date][reviewSlot]||[]).forEach(r => {
      if (!(r.work&&r.work.trim()) && !(r.people&&r.people.trim())) return;
      const t = r.time || "未定";
      if (!byTime[t]) byTime[t] = [];
      byTime[t].push({ date:date, work:(r.work||"").trim(), people:(r.people||"").trim() });
    });
  });

  const times = Object.keys(byTime).sort();
  let total = 0;
  const weekSet = {};
  const peopleCount = {};
  times.forEach(t => byTime[t].forEach(r => {
    total++;
    weekSet[weekId(r.date)] = 1;
    r.people.split(/[、，,\s\/]+/).forEach(p => { if (p) peopleCount[p] = (peopleCount[p]||0)+1; });
  }));

  let html = '<div class="review-head">'
    + '<div class="rh-title">📅 每'+wdName+' '+slotObj.ico+' '+slotObj.name+'</div>'
    + '<div class="rh-actions">'
    + '<button onclick="toggleReviewOrder()">'+(reviewOrder==="asc"?"旧→新 ↓":"新→旧 ↑")+'</button>'
    + (total ? '<button onclick="exportReview()">导出</button>' : '')
    + '</div></div>';

  if (!total) {
    html += '<div class="empty-tip">每'+wdName+' '+slotObj.name+'暂无历史记录</div>';
    box.innerHTML = html;
    return;
  }

  html += '<div class="timeline">';
  times.forEach(t => {
    const list = byTime[t].slice().sort((a,b)=> reviewOrder==="asc" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
    const weeks = {};
    list.forEach(r => weeks[weekId(r.date)] = 1);
    const nWeeks = Object.keys(weeks).length;
    html += '<div class="time-group">'
      + '<div class="time-tag">🕐 '+t+(nWeeks>=2 ? '<span class="fire">🔥 '+nWeeks+'周</span>' : '')+'</div>';
    list.forEach((r,i) => {
      html += '<div class="tg-rec'+(i%2===1?" alt":"")+'">'
        + '<div class="tg-body">'
        + '<span class="tg-date">'+fmtCN(r.date)+'</span>'
        + '<div class="tg-work">'+escapeHtml(r.work || "（无工作内容）")+'</div>'
        + (r.people ? '<div class="tg-people">人员：'+escapeHtml(r.people)+'</div>' : '')
        + '</div>'
        + '<button class="tg-jump" onclick="openDayByKey(\''+r.date+'\')">查看</button>'
        + '</div>';
    });
    html += '</div>';
  });
  html += '</div>';

  // 统计区
  const top3 = Object.keys(peopleCount).map(p=>[p,peopleCount[p]]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  html += '<div class="review-stats">共找到 <b>'+total+'</b> 条记录，横跨 <b>'+Object.keys(weekSet).length+'</b> 周';
  if (top3.length) {
    html += '<br>该时段常见人员：' + top3.map((x,i)=>(i+1)+'. <b>'+escapeHtml(x[0])+'</b>（'+x[1]+'次）').join('　');
  }
  html += '</div>';
  box.innerHTML = html;
}

function toggleReviewOrder() {
  reviewOrder = reviewOrder==="asc" ? "desc" : "asc";
  runReview();
}

function exportReview() {
  const slotObj = SLOTS.find(s=>s.key===reviewSlot);
  const wdName = ["","周一","周二","周三","周四","周五","周六","周日"][reviewWeekday];
  const lines = ["周期规律回顾：每"+wdName+" "+slotObj.name, ""];
  const byTime = {};
  Object.keys(ALL).forEach(date => {
    const d = new Date(date+"T00:00:00");
    if ((d.getDay()===0 ? 7 : d.getDay()) !== reviewWeekday) return;
    (ALL[date][reviewSlot]||[]).forEach(r => {
      if (!(r.work&&r.work.trim()) && !(r.people&&r.people.trim())) return;
      const t = r.time || "未定";
      if (!byTime[t]) byTime[t] = [];
      byTime[t].push({ date:date, work:(r.work||"").trim(), people:(r.people||"").trim() });
    });
  });
  let total = 0;
  const weekSet = {};
  Object.keys(byTime).sort().forEach(t => {
    lines.push("🕐 "+t);
    byTime[t].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r => {
      total++; weekSet[weekId(r.date)] = 1;
      lines.push("  "+r.date+"："+(r.work||"")+(r.people ? " | 人员："+r.people : ""));
    });
    lines.push("");
  });
  lines.push("共 "+total+" 条记录，横跨 "+Object.keys(weekSet).length+" 周");
  downloadText("周期回顾-每"+wdName+"-"+slotObj.name+".txt", lines.join("\n"));
}
